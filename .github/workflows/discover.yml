name: Discover and Build V2rayNG Base v4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone v2rayNG upstream (with submodules)
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/2dust/v2rayNG.git

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865" || \
          echo "y" | sdkmanager --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Add ndkVersion to build.gradle.kts
        run: |
          sed -i '/^android {/a\    ndkVersion = "29.0.14206865"' v2rayNG/V2rayNG/app/build.gradle.kts
          head -15 v2rayNG/V2rayNG/app/build.gradle.kts

      - name: Build libhevtun
        working-directory: v2rayNG
        run: |
          ls -la
          cat compile-hevtun.sh | head -20
          bash compile-hevtun.sh

      - name: Copy libhevtun into app
        run: |
          cp -r v2rayNG/libs v2rayNG/V2rayNG/app/ 2>&1 || echo "libs copy failed, checking structure"
          find v2rayNG -maxdepth 2 -iname "libs" -type d

      - name: Fetch AndroidLibXrayLite tag and download prebuilt AAR
        run: |
          cd v2rayNG/AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "Tag: $CURRENT_TAG"
          cd ../..
          mkdir -p v2rayNG/V2rayNG/app/libs
          curl -L -o v2rayNG/V2rayNG/app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${CURRENT_TAG}/libv2ray.aar"
          ls -la v2rayNG/V2rayNG/app/libs/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate gradle wrapper
        working-directory: v2rayNG/V2rayNG
        run: gradle wrapper --gradle-version 9.5

      - name: Try baseline build
        working-directory: v2rayNG/V2rayNG
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew assemblePlaystoreDebug -PABI_FILTERS=arm64-v8a --no-daemon 2>&1 | tail -150

      - name: Upload baseline APK if built
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-apk-v4
          path: |
            v2rayNG/V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
