name: Discover and Build V2rayNG Base v3

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Clone v2rayNG upstream (with submodules)
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/2dust/v2rayNG.git

      - name: Check current libs folder content
        run: |
          echo "--- app/libs contents ---"
          ls -la v2rayNG/V2rayNG/app/libs 2>&1 || echo "libs folder does not exist"

      - name: Check AndroidLibXrayLite build instructions
        run: |
          echo "--- README ---"
          cat v2rayNG/AndroidLibXrayLite/README.md 2>&1 | head -80
          echo "--- Makefile/build scripts ---"
          find v2rayNG/AndroidLibXrayLite -maxdepth 1 -iname "Makefile" -o -iname "*.sh" -o -iname "*.yml"

      - name: Check for prebuilt AAR releases (AndroidLibXrayLite)
        run: |
          curl -s https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest | grep -E '"tag_name"|"name"|"browser_download_url"'

      - name: Check v2rayNG's own CI workflow for build steps
        run: |
          find v2rayNG/.github/workflows -type f -name "*.yml" -exec echo "--- {} ---" \; -exec cat {} \;
