name: Discover and Build V2rayNG Base v2

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Clone v2rayNG upstream (with submodules)
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/2dust/v2rayNG.git

      - name: Verify submodules populated
        run: |
          echo "--- AndroidLibXrayLite ---"
          ls -la v2rayNG/AndroidLibXrayLite | head -20
          echo "--- hev-socks5-tunnel ---"
          ls -la v2rayNG/hev-socks5-tunnel | head -20

      - name: Search for theme/color definitions
        run: |
          find v2rayNG -name "themes.xml" -exec echo "--- {} ---" \; -exec cat {} \;

      - name: Search for hardcoded color values
        run: grep -rn "#[0-9A-Fa-f]\{6\}" v2rayNG/V2rayNG/app/src/main/res --include="*.xml" | head -40

      - name: Search for github links in Kotlin UI files
        run: grep -n "github.com/2dust\|t.me/\|Telegram" v2rayNG/V2rayNG/app/src/main/java/com/v2ray/ang/ui/AboutActivity.kt v2rayNG/V2rayNG/app/src/main/java/com/v2ray/ang/AppConfig.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate gradle wrapper
        working-directory: v2rayNG/V2rayNG
        run: gradle wrapper --gradle-version 9.5

      - name: Try baseline build (single ABI, playstore flavor only, for speed)
        working-directory: v2rayNG/V2rayNG
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew assemblePlaystoreDebug -PABI_FILTERS=arm64-v8a --no-daemon 2>&1 | tail -150

      - name: Upload baseline APK if built
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-apk-v2
          path: |
            v2rayNG/V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
