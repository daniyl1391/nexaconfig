name: Discover Theme File v6

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Clone v2rayNG upstream (shallow)
        run: git clone --depth 1 https://github.com/2dust/v2rayNG.git

      - name: Show Theme.kt full content
        run: cat v2rayNG/V2rayNG/app/src/main/java/com/v2ray/ang/ui/compose/Theme.kt

      - name: Show ic_launcher_background color value
        run: cat v2rayNG/V2rayNG/app/src/main/res/values/ic_launcher_background.xml

      - name: Show fdroid launcher icon (might differ)
        run: |
          find v2rayNG/V2rayNG/app/src/fdroid -iname "*ic_launcher*" 2>&1 || echo "none"
